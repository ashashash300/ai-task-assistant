[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-task-assistant"
version = "0.1.0"
description = "An AI-powered task management API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "google-genai>=2.3,<3.0",
    "openai>=1.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_task_assistant"]
